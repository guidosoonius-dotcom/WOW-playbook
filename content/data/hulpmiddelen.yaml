# Pagina's "Hulpmiddelen en systemen" en "Templates" (blok D). Alleen tekst.
hulpmiddelen:
  titel: Hulpmiddelen en systemen
  kern: Drie systemen ondersteunen al het werk in Samen Digitaal.
  lead: Per soort informatie werken we in de afgesproken bron. Zo staat alles op één plek en hoef je niets dubbel in te vullen.
  systemen:
    - titel: IT-servicemanagementsysteem
      spoor: De run
      voor: "Voor onder andere incidenten, serviceverzoeken, standaardveranderingen en communicatie met eindgebruikers."
      primair: Ondersteunt ITSM. Staat niet in het portfoliosysteem.
    - titel: Portfoliomanagementsysteem
      spoor: Portfolio en project
      voor: "Voor portfolio-overzicht, projectregistratie, relatie met strategische doelen, budgetbewaking, bestuurlijke sturing en verantwoording."
      primair: De primaire bron voor portfolio-, project- en O&I-informatie.
    - titel: Backlogmanagementsysteem
      spoor: Vast team
      voor: "Voor backlogmanagement en uitvoering: epics, stories, bugs, sprintplanning en release."
      primair: Ondersteunt de team- en productbacklogs.
  daarnaast:
    titel: Daarnaast
    tekst: Er zijn nog diverse ondersteuningen die in sommige teams of projecten van toegevoegde waarde kunnen zijn.
    tools:
      - naam: Blue Dolphin
        wat: "We gebruiken de proces- en architectuurtool om belangrijke processen en hun samenhang met mensen, systemen en organisatiedoelen inzichtelijk te maken. Het ondersteunt ook waardestromen, architectuur en systemen."
        gebruik: We gebruiken gepubliceerde modellen voor afstemming, besluitvorming, impactanalyse en continu verbeteren.
        rollen:
          - { rol: Proceseigenaar, taak: Is verantwoordelijk voor de inhoud en actualiteit. }
          - { rol: Procesmodelleur, taak: Legt het proces vast met de uitvoerenden. }
          - { rol: Procesinstemmer, taak: Toetst en publiceert. }
  visual_volgt: Het overzicht van hoe de systemen samenhangen ontbreekt nog in het document.

templates:
  titel: Templates
  kern: De documenten die je bij een idee, een project of een team gebruikt.
  lead: Sommige kun je hier direct invullen. De andere beschrijven we eerst, de invulbare versie volgt.
  invullen: Direct invullen
  volgt: Invulbare versie volgt
  lijst:
    - { naam: Idee Project Kaart, wanneer: "Bij een nieuw idee en bij de eerste fase van een project (T0).", tekst: "Legt het initiatief vast en toetst strategische fit, waarde, synergie en mogelijke IT- of data-impact.", werkvorm: idee-project-kaart }
    - { naam: Project Opdracht Kaart, wanneer: Analyse van een project (T1)., tekst: "Werkt het goedgekeurde idee uit, met haalbaarheid, oplossing, impact, prioriteit en een eerste investeringsinschatting." }
    - { naam: Plan van Aanpak, wanneer: Definitie van een project (T2)., tekst: "Maakt het project concreet: scope, planning, governance, capaciteit, risico's en verantwoordelijkheden." }
    - { naam: Business Case, wanneer: "Definitie van een project (T2), samen met het Plan van Aanpak.", tekst: Onderbouwt de investering in het project. }
    - { naam: Project Start Architectuur, wanneer: Bij de start van een project., tekst: "Beschrijving volgt." }
    - { naam: Lean Business Case, wanneer: "Bij een epic voor een vast team, waar nodig.", tekst: "Onderbouwt een epic met een toetsbare hypothese. Na de MVP besluit het portfolio over het vervolg.", werkvorm: lean-business-case }
    - { naam: Roadmap, wanneer: Bij een vast team., tekst: Het digitale productteam beheert de roadmap en vertaalt doelen naar concrete deliverables. }
    - { naam: Product backlog, wanneer: Bij een vast team., tekst: Het digitale productteam beheert de productbacklog en levert iteratief op. }
    - { naam: Team backlog, wanneer: Bij een vast team., tekst: "Eén backlog per team, waarin al het werk samenkomt: portfolio-initiatieven, projectwerk, beheer, bugs en verbeteringen." }
